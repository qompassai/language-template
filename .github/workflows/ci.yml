name: ci
on:
  push:
  pull_request:

jobs:
  # Each profile directory is self-checking: if a profile ships a test
  # runner, CI runs it. Language-specific jobs are added on instantiation.
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          test -f LICENSE
          test -f README.md
          test -f CHANGELOG.md
          grep -q "Apache License" LICENSE
      - name: No placeholder leaks outside template files
        # After instantiation there must be no {{PLACEHOLDER}} left in
        # README.md or CITATION.cff. (The template repo itself keeps them.)
        run: |
          if [ "${{ github.repository }}" != "qompassai/language-template" ]; then
            ! grep -rn "{{" README.md CITATION.cff
          fi
